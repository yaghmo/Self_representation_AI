# `docker compose up --build` runs everything at once — cookbook (probe/fit/
# download, port 8001), the admin-side chat service (port 8000, agent mode —
# see CLAUDE.md's "two surfaces" rule), and the web frontend (port 3000). No
# `--profile` flag needed for local/dev use.
#
# The old fan/admin split still exists for a real deployment later — it's
# just not the default anymore. Bring up the public, tools-off surface
# instead with `docker compose --profile fan up service-fan web` (profiles
# opt a service *out* of the default group, so naming service-fan explicitly
# is what pulls it back in).
#
# First-time setup: open localhost:3000, use the cookbook page to probe/fit/
# download — writes ./config/stack.json and ./models/ (same volumes
# service-admin mounts below, so nothing further to copy). The llama-server
# binary itself is baked into the image (see Dockerfile) — nothing to
# download for it. GPU passthrough needs nvidia-container-toolkit on the host.

services:
  # Backs runtime/handle_resolve.py's nickname->real-handle search (used
  # when a bio @-mentions a display name that isn't the account's actual
  # handle). Self-hosted metasearch instead of driving a headless browser
  # at one search engine's HTML — no browser-launch latency, and one
  # upstream engine (DuckDuckGo, Google, ...) getting itself rate-limited
  # doesn't take the whole lookup down with it. Internal-only: nothing
  # publishes this past the compose network except the host port below,
  # which exists for manual debugging (curl localhost:8081), not for any
  # service to depend on.
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8081:8080"
    volumes:
      - ./docker/searxng:/etc/searxng:rw

  cookbook:
    build:
      context: .
      args:
        INSTALL_ADMIN: "false"
    entrypoint: []
    command: ["uvicorn", "cookbook.api:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    volumes:
      - ./config:/app/config
      - ./models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  service-fan:
    build:
      context: .
      args:
        INSTALL_ADMIN: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./models:/app/models
      # Docker-outside-of-Docker: runtime/qwentts.py's TTSServer shells out
      # to `docker run` to launch qwentts.cpp's own image alongside this
      # one, on the *host's* daemon (there's no dockerd inside this image).
      # A container spawned that way publishes its port on the host, not on
      # this container's own network namespace — host.docker.internal below
      # is what lets this container reach back out to it.
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ADMIN_UI_ORIGIN: ${ADMIN_UI_ORIGIN:-http://localhost:3000}
      # Only reached if config/stack.json's roles.llm picks an API provider
      # (cookbook/providers.json) — a local-only stack never touches these.
      # The values themselves live in a gitignored .env, never here or in
      # stack.json (see providers.json's own comment on that).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      XKIRO_API_KEY: ${XKIRO_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      FISH_API_KEY: ${FISH_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["fan"]

  service-admin:
    build:
      context: .
      args:
        INSTALL_ADMIN: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./models:/app/models
      # Docker-outside-of-Docker: runtime/qwentts.py's TTSServer shells out
      # to `docker run` to launch qwentts.cpp's own image alongside this
      # one, on the *host's* daemon (there's no dockerd inside this image).
      # A container spawned that way publishes its port on the host, not on
      # this container's own network namespace — host.docker.internal below
      # is what lets this container reach back out to it.
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ADMIN_UI_ORIGIN: ${ADMIN_UI_ORIGIN:-http://localhost:3000}
      # Only reached if config/stack.json's roles.llm picks an API provider
      # (cookbook/providers.json) — a local-only stack never touches these.
      # The values themselves live in a gitignored .env, never here or in
      # stack.json (see providers.json's own comment on that).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      XKIRO_API_KEY: ${XKIRO_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      FISH_API_KEY: ${FISH_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_CHAT_API_URL: ${NEXT_PUBLIC_CHAT_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SERVICE_URL: ${NEXT_PUBLIC_SERVICE_URL:-http://localhost:8000}
        NEXT_PUBLIC_COOKBOOK_API_URL: ${NEXT_PUBLIC_COOKBOOK_API_URL:-http://localhost:8001}
    ports:
      - "3000:3000"

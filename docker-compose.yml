# Two ways to run this: `docker compose --profile fan up` for a deployed
# instance (no admin tools, no scraping browser), or
# `docker compose --profile admin up` for the creator's own machine (full
# stack, agent mode). Never both — they're the same port and the same
# character bible, just different route access (see CLAUDE.md's "two
# surfaces" rule and pyproject.toml's `admin` extra).
#
# First-time setup, both profiles:
#   1. `docker compose --profile cookbook up --build`, open localhost:3000 —
#      probe/fit/download writes ./config/stack.json and ./models/ (same
#      volumes fan/admin mount below, so nothing further to copy). The
#      llama-server binary itself is baked into the image (see Dockerfile) —
#      nothing to download for it.
#   2. GPU passthrough needs nvidia-container-toolkit installed on the host.

services:
  cookbook:
    build:
      context: .
      args:
        INSTALL_ADMIN: "false"
    entrypoint: []
    command: ["uvicorn", "cookbook.api:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    volumes:
      - ./config:/app/config
      - ./models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["cookbook"]

  service-fan:
    build:
      context: .
      args:
        INSTALL_ADMIN: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./models:/app/models
    environment:
      ADMIN_UI_ORIGIN: ${ADMIN_UI_ORIGIN:-http://localhost:3000}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["fan"]

  service-admin:
    build:
      context: .
      args:
        INSTALL_ADMIN: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./models:/app/models
    environment:
      ADMIN_UI_ORIGIN: ${ADMIN_UI_ORIGIN:-http://localhost:3000}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["admin"]

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_CHAT_API_URL: ${NEXT_PUBLIC_CHAT_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SERVICE_URL: ${NEXT_PUBLIC_SERVICE_URL:-http://localhost:8000}
        NEXT_PUBLIC_COOKBOOK_API_URL: ${NEXT_PUBLIC_COOKBOOK_API_URL:-http://localhost:8001}
    ports:
      - "3000:3000"
    profiles: ["fan", "admin", "cookbook"]

[project]
name = "self-presentation-ai"
version = "0.1.0"
description = "Portfolio page and character chatbot for a content creator"
requires-python = ">=3.10,<3.11"

dependencies = [
    "streamlit>=1.40",
    "psutil>=6.0",
    "nvidia-ml-py>=12.560",
    "huggingface-hub>=0.26",
    "fastapi>=0.140.13",
    "uvicorn[standard]>=0.51.0",
    "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
# Heavy runtime deps, split out so the cookbook alone stays a small install.
runtime = [
    "torch>=2.5",
    "transformers>=4.45",
    "numpy>=1.24",
    # Extras, not bare markitdown: 0.1.x moved per-format support out of the
    # base package, so the bare install converts nothing /story would be given.
    "markitdown[docx,pdf]>=0.1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cookbook"]

[tool.uv]
# Weights live in the project, never in the user's Hugging Face cache.
# See cookbook/download.py, which sets HF_HUB_CACHE accordingly.

# PyPI's torch wheel for Windows is CPU-only. GPU builds come from PyTorch's
# own index, and the CUDA runtime is bundled into the wheel — hence the size.
# cu126 rather than cu130: this driver (610.62) supports either, but third
# party wheels still assume cu12x. sm_89 (Ada) is covered by both.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

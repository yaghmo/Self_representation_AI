name: CI

on:
  push:
  pull_request:

jobs:
  web-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  python-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # Base deps only, no --extra runtime/admin — service.main and
      # cookbook.api both lazy-import torch/transformers/scrapling/curl_cffi
      # deep inside functions specifically so this stays possible. If this
      # job ever needs an extra to pass, something regressed that contract.
      - run: uv sync
      - run: uv run python -c "import service.main; import cookbook.api"
